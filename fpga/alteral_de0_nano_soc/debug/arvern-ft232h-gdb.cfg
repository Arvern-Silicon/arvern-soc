# OpenOCD GDB server for the aRVern RISC-V core over an FT232H JTAG DTM
# (DTM_TYPE=0, the board default).
# Serves GDB on localhost:3333 (OpenOCD's default) -- point CLion's remote debug
# there and nothing else needs changing on the IDE side.
#
# Wiring (FT232H): D0=TCK, D1=TDI, D2=TDO, D3=TMS, common GND. I2C switch OFF.
# Needs an OpenOCD with RISC-V support (Homebrew open-ocd 0.12 has it).
#
#   openocd -f arvern-ft232h-gdb.cfg      # runs until Ctrl-C, listening on :3333

adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi layout_init 0x0008 0x000b        ;# D0=TCK D1=TDI D2=TDO D3=TMS, TMS idles high

transport select jtag
adapter speed 1000                     ;# TCK in kHz (1 MHz). Raise (e.g. 6000) once stable; design.sdc constrains TCK to 25 MHz.

# No SRST/TRST wired -> reset goes through the Debug Module's ndmreset, not pins.
reset_config none

# aRVern TAP: 5-bit IR, reference IDCODE 0x080001F7 (mismatch only warns).
# [11:1] = Arvern Silicon's JEDEC identity (IEEE 1149.1 §12.2.1); [27:12] =
# 0x8000, this board (DE0-Nano-SoC) in Arvern's FPGA catalog. See arv_dtm.md.
# A mismatch means the bitstream was built with a different IDCODE -- re-flash.
jtag newtap arvern cpu -irlen 5 -expected-id 0x080001F7
target create arvern.cpu riscv -chain-position arvern.cpu

# OpenOCD 0.12 does NOT halt on GDB attach by default, so an IDE (CLion) connecting
# to a running hart fails to insert breakpoints ("target running"). Halt on attach
# and resume on detach so the IDE always gets a stopped target to work with.
arvern.cpu configure -event gdb-attach { halt }
arvern.cpu configure -event gdb-detach { resume }

# Frozen-hart / abstract-access core: no program buffer -> route memory over the
# System Bus (SBA). Register access uses abstract commands.
riscv set_mem_access sysbus

gdb_port 3333                          ;# CLion default; set explicitly for clarity

init
halt                                   ;# leave the hart halted and ready for GDB
