# SEGGER RTT terminal for firmware built against software/lib/segger.
#
#   openocd -f arvern-ft232h-gdb.cfg -f arvern-rtt.cfg
#   nc localhost 9090          # or: telnet localhost 9090
#
# !! THIS FILE CANNOT WORK WITH A `riscv` TARGET AS OF OpenOCD 0.12. !!
#
# OpenOCD registers the `rtt setup`/`start`/`stop`/`channels` commands PER TARGET
# TYPE, and the riscv target does not register them. Only `rtt server` -- the
# bare TCP frontend -- is global. So `rtt setup` on line 25 is not a bad
# argument or a mistimed call: the command does not exist, and the config aborts
# with OpenOCD's unknown-subcommand usage tree.
#
# Verified on one binary, changing only the target type:
#
#   target create t.cpu cortex_m ... -> rtt setup/start/stop/channels present
#   target create t.cpu riscv    ... -> rtt server ONLY
#
# So this is NOT a build problem. Homebrew 0.12.0_1 and xpack 0.12.0-7 behave
# identically; switching builds does not help, and no reordering, event hook, or
# `monitor rtt start` from GDB rescues it. Check any candidate build with:
#
#   openocd -c "adapter driver dummy" -c "transport select jtag" \
#           -c "jtag newtap t cpu -irlen 5 -expected-id 0x080001f7" \
#           -c "target create t.cpu riscv -chain-position t.cpu" \
#           -c "help rtt" -c shutdown
#
# The engine itself is target-agnostic (src/target/rtt.c uses ordinary target
# memory reads), so teaching the riscv target to chain the same command handlers
# looks tractable -- but that is an OpenOCD patch, untested here.
#
# USE arvern-tools INSTEAD. Both speak the same protocol from the host over SBA
# and need no OpenOCD at all:
#
#   arvern-minidebug                     -> the RTT tab (address from the ELF)
#   arvern-gdbserver --rtt-port 19021    -> nc localhost 19021
#
# This file is kept only as a record of the intended flow, for the day the riscv
# target gains RTT support upstream.
#
# RTT is a ring buffer in target SRAM. The host finds a control block by scanning
# for its "SEGGER RTT" ID string, then reads the up-buffer and writes the
# down-buffer over SBA. No UART, no pins, and -- crucially -- no halting: this
# only works because aRVern's SBA arbitrates for the data AHB port, so memory is
# reachable while the hart runs. On a halted-only SBA it could not work at all.
#
# ORDER MATTERS: the control block lives in .bss and is filled in by
# SEGGER_RTT_Init() at runtime, so `rtt start` only finds it once the firmware has
# actually run. Load and run the image first; if `rtt start` reports nothing, the
# hart is probably still sitting at the reset vector.
#
# The search range is the whole 32 KiB SRAM. leds places the block at 0x80000000
# (start of SRAM), but scanning the region keeps this working for any firmware
# without hard-coding a link-order-dependent address.
#
# Note the ID is also present in the loaded image in ROM if a build ever
# statically initialises it -- keep the range on SRAM only so the scan cannot
# latch onto a read-only copy whose WrOff never moves.

rtt setup 0x80000000 0x8000 "SEGGER RTT"
rtt start

# Channel 0 both ways: target->host printf, host->target keystrokes.
rtt server start 9090 0

echo "RTT: channel 0 served on localhost:9090  (nc localhost 9090)"
