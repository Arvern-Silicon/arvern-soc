# Stress / soak test for the aRVern Debug Module, driven entirely from OpenOCD.
#
# Needs the JTAG DTM build (DTM_TYPE=0, the board default).
#
# Runs in-process as an OpenOCD script -- no telnet, no GDB, no toolchain. Load it
# AFTER the normal config (which ends in `init` + `halt`, so the target exists and
# the hart is stopped by the time this file is sourced):
#
#   openocd -f arvern-ft232h-gdb.cfg -f arvern-stress.cfg
#
# Knobs are overridable on the command line -- `-c` runs before `-f`:
#
#   openocd -c "set STRESS_SPEEDS {1000 6000}" -c "set STRESS_ITERS 50" \
#           -f arvern-ft232h-gdb.cfg -f arvern-stress.cfg
#
# What it targets (roughly in order of how little the RTL suite can reach it):
#   1. TCK sweep      -- the JTAG DTM's real clock-domain crossing and the DMI
#                        busy/sticky-error retry path. Simulation cannot exercise
#                        this; it is the main reason to run on hardware.
#   2. SBA integrity  -- walking + address-tagged patterns through the System Bus
#                        master at every access size, at every TCK speed.
#   3. sbbusyerror    -- `riscv test_sba_config_reg ... 1` drives the one condition
#                        verification_guide.md records as unreachable in sim ("with
#                        no-wait-state memory ... cannot be provoked deterministically").
#   4. Error recovery -- an unmapped access must fail AND leave the DM usable, i.e.
#                        the sticky sberror must be cleared rather than wedging SBA.
#   5. Triggers       -- how many mcontrol6 triggers are actually allocatable.
#   6. Run control    -- halt/resume/step/reset-halt soak.
#
# SAFETY: the memory tests save the window, hammer it, and write the original
# contents back, so RAM survives. The run-control phase does resume the hart, so
# the *program's* state is disturbed; the script ends with `reset halt`, leaving the
# hart stopped at the reset vector. Re-`load` your ELF afterwards.

# --- knobs ------------------------------------------------------------------
if {![info exists STRESS_SPEEDS]}   { set STRESS_SPEEDS {1000 6000 10000 15000 20000 25000} } ;# kHz; design.sdc constrains TCK to 25 MHz
if {![info exists STRESS_RAM]}      { set STRESS_RAM    0x80006000 } ;# scratch window (saved/restored)
if {![info exists STRESS_WORDS]}    { set STRESS_WORDS  256        } ;# 1 KiB
if {![info exists STRESS_ROM]}      { set STRESS_ROM    0x20000000 } ;# read-only signature source
if {![info exists STRESS_BAD]}      { set STRESS_BAD    0xffffffc0 } ;# unmapped -> must error
if {![info exists STRESS_TRIGGERS]} { set STRESS_TRIGGERS 2        } ;# expected DM_TRIGGER_NR
if {![info exists STRESS_ITERS]}    { set STRESS_ITERS  20         } ;# soak repetitions
if {![info exists STRESS_SBA_TEST]} { set STRESS_SBA_TEST 1        } ;# run test_sba_config_reg
if {![info exists STRESS_SHUTDOWN]} { set STRESS_SHUTDOWN 1        } ;# exit openocd when done
if {![info exists STRESS_HAMMER_CB]} { set STRESS_HAMMER_CB 0x80007f00 } ;# busmash control block (__hammer_cb)
if {![info exists STRESS_SOAK]}     { set STRESS_SOAK    1          } ;# soak iterations at top TCK

# --- tiny result harness ----------------------------------------------------
set ::S_PASS  0
set ::S_FAIL  0
set ::S_FAILS {}
set ::S_PHASE ""
set ::S_ITER  ""      ;# soak iteration, so a rare failure can be located in time
set ::S_FIRST ""      ;# first failure seen -- the only one that matters in a long soak
set ::S_QUIET 0       ;# suppress per-pass output (soak would otherwise flood)

proc s_phase {title} {
    set ::S_PHASE $title
    echo ""
    echo "=============================================================="
    echo "  $title"
    echo "=============================================================="
}
proc s_ok {name} {
    incr ::S_PASS
    if {!$::S_QUIET} { echo [format "  pass  %s" $name] }
}
proc s_no {name why} {
    incr ::S_FAIL
    set where $::S_PHASE
    if {$::S_ITER ne ""} { set where "$where iter=$::S_ITER" }
    lappend ::S_FAILS [format "%-28s %s -- %s" $where $name $why]
    if {$::S_FIRST eq ""} { set ::S_FIRST [format "%s: %s -- %s" $where $name $why] }
    echo [format "  FAIL  %s -- %s" $name $why]
}
proc s_check {name cond why} {
    if {$cond} { s_ok $name } else { s_no $name $why }
}

# 32-bit value of a register, by ABI name.
#
# Uses `reg`, NOT `get_reg`. After a reset invalidates OpenOCD's register cache,
# `get_reg` hands back a stale entry -- it returns 0x00000000 for pc immediately
# after `reset halt`, while `reg pc` forces a real abstract read and returns the
# true reset vector. Reading this wrong makes a perfectly healthy core look wedged.
proc s_reg {name} {
    return [expr {[lindex [reg $name] end] & 0xffffffff}]
}

# Force OpenOCD's register cache to refresh, so a following `get_reg` is truthful.
proc s_sync {} { catch {reg pc} }

# `riscv dmi_read` returns its value with surrounding whitespace/newlines.
proc s_dmi {addr} { return [string trim [riscv dmi_read $addr]] }

# Clear the SBA sticky error bits (sbcs: sbbusyerror[22] + sberror[14:12], W1C).
# While either is set the DM starts no new access, so a single bad address would
# otherwise poison every later transfer -- including a scratch-window restore.
proc s_sba_clear {} { catch {riscv dmi_write 0x38 0x00407000} }

# --- memory helpers ---------------------------------------------------------

# Read `words` 32-bit words and return them as a plain integer list.
proc s_rd32 {base words} {
    set out {}
    foreach v [read_memory $base 32 $words] { lappend out [expr {$v & 0xffffffff}] }
    return $out
}

# Write one constant pattern across the window and verify it reads back.
proc s_pattern {tag base words pat} {
    set data {}
    for {set i 0} {$i < $words} {incr i} { lappend data [format 0x%08x $pat] }
    if {[catch {write_memory $base 32 $data} e]} { s_no "$tag write" $e ; return }
    if {[catch {set rb [s_rd32 $base $words]} e]} { s_no "$tag read" $e ; return }
    for {set i 0} {$i < $words} {incr i} {
        if {[lindex $rb $i] != $pat} {
            s_no "$tag" [format "word %d: wrote 0x%08x read 0x%08x @0x%08x" \
                          $i $pat [lindex $rb $i] [expr {$base + 4*$i}]]
            return
        }
    }
    s_ok $tag
}

# Address-tagged pattern: every word carries its own address, so an autoincrement
# or address-aliasing fault shows up as a wrong-but-valid value rather than noise.
proc s_addr_tag {base words} {
    set data {}
    for {set i 0} {$i < $words} {incr i} {
        lappend data [format 0x%08x [expr {(($base + 4*$i) ^ 0xa5a5a5a5) & 0xffffffff}]]
    }
    if {[catch {write_memory $base 32 $data} e]} { s_no "addr-tag write" $e ; return }
    if {[catch {set rb [s_rd32 $base $words]} e]} { s_no "addr-tag read" $e ; return }
    for {set i 0} {$i < $words} {incr i} {
        set want [expr {(($base + 4*$i) ^ 0xa5a5a5a5) & 0xffffffff}]
        if {[lindex $rb $i] != $want} {
            s_no "addr-tag" [format "word %d @0x%08x: want 0x%08x got 0x%08x" \
                          $i [expr {$base + 4*$i}] $want [lindex $rb $i]]
            return
        }
    }
    s_ok "addr-tag (autoincrement / aliasing)"
}

# 8- and 16-bit SBA accesses: sbaccess=0 and 1.
proc s_narrow {base} {
    if {[catch {
        write_memory $base 8 {0x11 0x22 0x33 0x44}
        set b [read_memory $base 8 4]
    } e]} { s_no "sbaccess=0 (byte)" $e } else {
        s_check "sbaccess=0 (byte)" \
            [expr {[lindex $b 0]==0x11 && [lindex $b 1]==0x22 && [lindex $b 2]==0x33 && [lindex $b 3]==0x44}] \
            "byte readback mismatch: $b"
    }
    if {[catch {
        write_memory $base 16 {0xbeef 0xdead}
        set h [read_memory $base 16 2]
    } e]} { s_no "sbaccess=1 (half)" $e } else {
        s_check "sbaccess=1 (half)" \
            [expr {[lindex $h 0]==0xbeef && [lindex $h 1]==0xdead}] \
            "half readback mismatch: $h"
    }
}

# Full memory pass over the scratch window, contents preserved.
proc s_mem_pass {base words} {
    if {[catch {set saved [s_rd32 $base $words]} e]} {
        s_no "scratch save" "cannot read scratch window: $e"
        return
    }
    s_pattern "pattern 0x00000000" $base $words 0x00000000
    s_pattern "pattern 0xffffffff" $base $words 0xffffffff
    s_pattern "pattern 0x55555555" $base $words 0x55555555
    s_pattern "pattern 0xaaaaaaaa" $base $words 0xaaaaaaaa
    s_addr_tag $base $words
    s_narrow   $base
    s_sba_clear
    set restore {}
    foreach v $saved { lappend restore [format 0x%08x $v] }
    if {[catch {write_memory $base 32 $restore} e]} { s_no "scratch restore" $e } \
    else { s_ok "scratch restored" }
}

# Whole-GPR reads exercise the abstractauto + aarpostincrement streaming path.
# Nothing runs while halted, so the values must be bit-identical every time.
# On RV32E (misa.E, bit 4) x16-x31 do not exist, so only x0-x15 are read.
set ::S_GPRS {zero ra sp gp tp t0 t1 t2 fp s1 a0 a1 a2 a3 a4 a5 a6 a7 s2 s3 s4 s5 s6 s7 s8 s9 s10 s11 t3 t4 t5 t6 pc}
set ::S_GPRS_E {zero ra sp gp tp t0 t1 t2 fp s1 a0 a1 a2 a3 a4 a5 pc}
proc s_regfile {iters} {
    s_sync   ;# refresh the cache first, else the reference read may be stale
    if {[catch {set misa [s_reg misa]} e]} { s_no "misa read" $e ; return }
    if {$misa & 0x10} { set gprs $::S_GPRS_E } else { set gprs $::S_GPRS }
    if {[catch {set ref [get_reg $gprs]} e]} { s_no "register-file read" $e ; return }
    for {set i 0} {$i < $iters} {incr i} {
        if {[catch {set now [get_reg $gprs]} e]} {
            s_no "register-file read" "iteration $i: $e" ; return
        }
        if {$now ne $ref} {
            s_no "register-file stability" "iteration $i differs from first read"
            return
        }
    }
    s_ok "register file x$iters stable (abstractauto/postincrement)"
}

# --- running-hart helpers ---------------------------------------------------

# Firmware-agnostic liveness: sample .bss twice and see whether anything moved.
proc s_live_words {} {
    if {[catch {set a [read_memory 0x80000000 32 16]}]} { return -1 }
    for {set i 0} {$i < 200} {incr i} { catch {read_memory 0x20000000 32 1} }
    if {[catch {set b [read_memory 0x80000000 32 16]}]} { return -1 }
    set n 0
    for {set i 0} {$i < 16} {incr i} {
        if {[lindex $a $i] ne [lindex $b $i]} { incr n }
    }
    return $n
}

# The busmash firmware (software/apps/busmash) saturates the data AHB port and
# self-checks its own region, so the arbiter is actually asked to arbitrate. Its
# control block tells us two things nothing else can: that the hart is still
# ALIVE (heartbeat moving -- otherwise every later check passes vacuously), and
# that the debugger has not corrupted the hart's data (ERRS still zero). The
# reverse direction -- hart corrupting debugger data -- is what s_mem_pass's
# address-tagged pattern on STRESS_RAM covers, which is why the two regions must
# stay disjoint (see busmash/link.ld).
set ::S_HB     0
set ::S_HAMMER 0
proc s_hammer_present {} {
    global STRESS_HAMMER_CB
    if {[catch {set cb [read_memory $STRESS_HAMMER_CB 32 1]}]} { return 0 }
    return [expr {[lindex $cb 0] == 0x48414d52}]   ;# 'HAMR'
}
proc s_hammer_sample {} {
    global STRESS_HAMMER_CB
    if {!$::S_HAMMER} { return }
    catch {set ::S_HB [lindex [read_memory $STRESS_HAMMER_CB 32 2] 1]}
}
proc s_hammer_check {tag} {
    global STRESS_HAMMER_CB
    if {!$::S_HAMMER} {
        s_check "$tag: hart progressing (.bss heuristic)" [expr {[s_live_words] > 0}] \
            "no .bss word changed -- load software/apps/busmash for a real contention test"
        return
    }
    if {[catch {set cb [read_memory $STRESS_HAMMER_CB 32 7]}]} {
        s_no "$tag: hammer control block" "unreadable"
        return
    }
    set hb [lindex $cb 1] ; set errs [lindex $cb 2]
    s_check "$tag: hammer alive (heartbeat moving)" [expr {$hb != $::S_HB}] \
        "heartbeat stuck at $hb -- firmware stalled or trapped; later checks would be vacuous"
    s_check "$tag: no debugger->hart corruption (ERRS=0)" [expr {$errs == 0}] \
        "ERRS=$errs first bad addr=[lindex $cb 4] got=[lindex $cb 5] want=[lindex $cb 6]"
    set ::S_HB $hb
}

# One full integrity pass with the hart running and competing for the data port.
# Idempotent: resumes on entry and halts on exit regardless of the state it is
# called in, so a mid-sweep failure cannot leave later iterations testing the
# wrong thing.
proc s_running_pass {tag} {
    global STRESS_RAM STRESS_WORDS
    catch {resume}
    if {[arvern.cpu curstate] ne "running"} {
        s_no "$tag: resume" "curstate=[arvern.cpu curstate]"
        catch {halt} ; return
    }
    s_hammer_sample
    s_mem_pass $STRESS_RAM $STRESS_WORDS
    s_check "$tag: hart still running" [expr {[arvern.cpu curstate] eq "running"}] \
        "curstate=[arvern.cpu curstate] -- debugger traffic must not halt the hart"
    s_hammer_check $tag
    catch {halt}
}

# --- baseline ---------------------------------------------------------------
s_phase "Baseline (at [lindex $STRESS_SPEEDS 0] kHz)"

adapter speed [lindex $STRESS_SPEEDS 0]
halt
s_check "hart halted" [expr {[arvern.cpu curstate] eq "halted"}] "curstate=[arvern.cpu curstate]"

if {[catch {set ::S_SIG [s_rd32 $STRESS_ROM 16]} e]} {
    s_no "ROM signature" $e
    set ::S_SIG {}
} else {
    s_ok "ROM signature captured ([llength $::S_SIG] words @[format 0x%08x $STRESS_ROM])"
}

set ::S_HAMMER [s_hammer_present]
if {$::S_HAMMER} {
    echo "  busmash hammer firmware DETECTED at [format 0x%08x $STRESS_HAMMER_CB] -- contention testing active"
} else {
    echo "  busmash hammer firmware NOT detected -- running-hart tests will be largely UNCONTENDED."
    echo "  Load software/apps/busmash/busmash.elf for a meaningful arbitration test."
}

echo "  dmstatus  = [s_dmi 0x11]"
echo "  dmcontrol = [s_dmi 0x10]"
echo "  sbcs      = [s_dmi 0x38]"
echo "  hartinfo  = [s_dmi 0x12]"

# --- TCK sweep --------------------------------------------------------------
set ::S_TOPSPEED 0
foreach spd $STRESS_SPEEDS {
    s_phase "TCK ${spd} kHz"

    if {[catch {adapter speed $spd} e]} { s_no "set speed" $e ; continue }
    catch {riscv reset_delays}
    if {[catch {halt} e]} { s_no "halt" $e ; continue }

    # Link check first: if the signature is wrong the rest is noise, so skip ahead.
    if {[llength $::S_SIG]} {
        if {[catch {set sig [s_rd32 $STRESS_ROM 16]} e]} {
            s_no "link @${spd}kHz" "ROM read failed: $e" ; continue
        }
        if {$sig ne $::S_SIG} {
            s_no "link @${spd}kHz" "ROM signature differs from baseline -- TCK too high"
            continue
        }
        s_ok "link stable (ROM signature matches)"
    }

    s_mem_pass $STRESS_RAM $STRESS_WORDS
    s_regfile 10
    s_running_pass "running@${spd}kHz"
    set ::S_TOPSPEED $spd
}

echo ""
echo "  highest TCK that passed: ${::S_TOPSPEED} kHz"
adapter speed [expr {$::S_TOPSPEED ? $::S_TOPSPEED : [lindex $STRESS_SPEEDS 0]}]
catch {riscv reset_delays}
halt

# --- SBA error paths and recovery -------------------------------------------
s_phase "SBA error paths + recovery"

# An unmapped access must fail...
s_check "unmapped read errors" \
    [catch {read_memory $STRESS_BAD 32 1}] \
    "read of [format 0x%08x $STRESS_BAD] unexpectedly succeeded"

# ...and, more importantly, must not wedge the bus: the sticky sberror has to be
# cleared so the very next access works. This is the failure mode that turns one
# bad address into a dead debug session.
if {[catch {set sig [s_rd32 $STRESS_ROM 16]} e]} {
    s_no "recovery after error" "ROM read failed after an unmapped access: $e"
} elseif {[llength $::S_SIG] && $sig ne $::S_SIG} {
    s_no "recovery after error" "ROM signature corrupted after an unmapped access"
} else {
    s_ok "SBA usable again after a bus error (sberror cleared)"
}

s_check "unmapped write errors" \
    [catch {write_memory $STRESS_BAD 32 {0x0}}] \
    "write to [format 0x%08x $STRESS_BAD] unexpectedly succeeded"
s_check "recovery after failed write" \
    [expr {![catch {read_memory $STRESS_ROM 32 1}]}] \
    "ROM unreadable after a failed write"

if {$STRESS_SBA_TEST} {
    echo ""
    echo "  riscv test_sba_config_reg (last arg drives sbbusyerror -- the condition"
    echo "  verification_guide.md records as unreachable in the RTL suite):"
    if {[catch {set saved [s_rd32 $STRESS_RAM 64]} e]} {
        s_no "sba_config_reg save" $e
    } else {
        if {[catch {riscv test_sba_config_reg $STRESS_RAM 32 $STRESS_BAD 1} e]} {
            # The command is deprecated and chatty; a non-zero exit is informative,
            # not automatically a defect, so record it without failing the run.
            echo "  note: test_sba_config_reg reported: $e"
        }
        s_sba_clear   ;# the test leaves sberror/sbbusyerror latched by design
        set restore {}
        foreach v $saved { lappend restore [format 0x%08x $v] }
        if {[catch {write_memory $STRESS_RAM 32 $restore}]} { s_no "restore after sba test" "SBA still refusing writes after clearing sticky errors" } else { s_ok "SBA usable after test_sba_config_reg" }
        s_ok "test_sba_config_reg completed (see log above for its own verdict)"
    }
}

# --- SBA on a RUNNING hart --------------------------------------------------
#
# The Debug Spec defines the System Bus Access block as providing "memory access
# without involving a hart", usable "while a hart is running". aRVern's SBA shares
# the core's data AHB port and arbitrates for it, so this phase is what proves the
# arbitration is correct rather than merely present: integrity of debugger traffic
# under contention, and that the hart keeps making progress underneath it.
s_phase "SBA on a RUNNING hart"

resume
s_check "hart is running" [expr {[arvern.cpu curstate] eq "running"}] \
    "curstate=[arvern.cpu curstate]"

# Liveness, firmware-agnostic: sample .bss twice and see whether anything moved.
# If words change, the hart is executing AND the debugger can observe it live --
# which is the whole point of running-hart SBA.
s_hammer_sample
s_hammer_check "entry"

# Full integrity pass with the hart competing for the same data port. Any
# arbitration fault (lost grant, torn transfer, wrong master's data) shows up here.
s_mem_pass $STRESS_RAM $STRESS_WORDS

s_check "hart still running after the memory pass" [expr {[arvern.cpu curstate] eq "running"}] \
    "curstate=[arvern.cpu curstate] -- debugger traffic must not halt the hart"
s_hammer_check "after memory pass"

# Raw SBA, so the error code can be read before OpenOCD clears it. sberror=7
# (other) is never produced: a valid address must read cleanly on a running hart,
# and an unmapped address must fail as 2 (address error).
proc s_sba_raw {addr} {
    riscv dmi_write 0x38 0x00407000                ;# clear sberror/sbbusyerror
    riscv dmi_write 0x38 0x00140000                ;# sbreadonaddr=1, sbaccess=2 (32-bit)
    riscv dmi_write 0x39 $addr                     ;# writing the address starts the read
    set cs 0
    for {set i 0} {$i < 200} {incr i} {
        set cs [expr {[s_dmi 0x38] & 0xffffffff}]
        if {!(($cs >> 21) & 1)} break              ;# wait for sbbusy to drop
    }
    return [list [expr {($cs >> 12) & 7}] [s_dmi 0x3c]]
}

set r [s_sba_raw $STRESS_ROM]
s_check "running-hart read: sberror=0" [expr {[lindex $r 0] == 0}] \
    "sberror=[lindex $r 0] reading a valid address while running"

set r [s_sba_raw $STRESS_BAD]
s_check "running-hart unmapped read: sberror=2, not 7" [expr {[lindex $r 0] == 2}] \
    "sberror=[lindex $r 0] (2=address error expected)"
s_sba_clear

s_check "SBA usable again after a running-hart bus error" \
    [expr {![catch {read_memory $STRESS_ROM 32 4}]}] \
    "SBA wedged after an unmapped access on a running hart"

# Halting with debugger traffic in flight: a race between the halt handshake and
# an arbitrated transfer.
set bad 0
for {set i 0} {$i < 10} {incr i} {
    catch {resume}
    catch {read_memory $STRESS_RAM 32 32}
    if {[catch {halt}]} { incr bad ; continue }
    if {[arvern.cpu curstate] ne "halted"} { incr bad }
    if {[catch {read_memory $STRESS_RAM 32 32}]} { incr bad }
}
s_check "halt during in-flight SBA traffic x10" [expr {$bad == 0}] "$bad iteration(s) failed"

# Watchpoints must not see the debugger's own traffic. Sdtrig matches on the HART's
# load/store port; an SBA transfer is tagged data_hmaster_o=1 and shares the same
# physical bus, so if the trigger compare were taken from the shared port instead of
# the LSU, a debugger memory write would fire the user's watchpoint. That is a false
# halt with no software cause -- the kind of bug that is maddening to chase later.
halt
set wpaddr [expr {$STRESS_RAM + 0x40}]
if {[catch {wp $wpaddr 4 w} e]} {
    s_no "watchpoint vs SBA setup" $e
} else {
    resume
    catch {write_memory $wpaddr 32 {0x5a5a5a5a}}   ;# debugger write to the watched word
    catch {read_memory  $wpaddr 32 1}              ;# and a debugger read of it
    s_check "SBA traffic does not fire a hart watchpoint" \
        [expr {[arvern.cpu curstate] eq "running"}] \
        "hart halted after a debugger access to a watched address -- trigger is matching SBA, not the LSU"
    halt
    catch {rwp $wpaddr}
}

# --- triggers ---------------------------------------------------------------
s_phase "Sdtrig triggers"

halt
set placed {}
for {set i 0} {$i < 8} {incr i} {
    set a [expr {$STRESS_ROM + 0x100 + 0x40*$i}]
    if {[catch {bp $a 4 hw}]} { break }
    lappend placed $a
}
s_check "allocatable hardware breakpoints" \
    [expr {[llength $placed] == $STRESS_TRIGGERS}] \
    "allocated [llength $placed], expected $STRESS_TRIGGERS (DM_TRIGGER_NR)"
echo "  allocated [llength $placed] hw breakpoint(s)"
foreach a $placed { catch {rbp $a} }

# Watchpoints use the same triggers via the load/store match path, and have no
# software fallback -- if these work the mcontrol6 data-address path is live.
if {[catch {wp [expr {$STRESS_RAM + 0x10}] 4 w} e]} {
    s_no "write watchpoint" $e
} else {
    s_ok "write watchpoint set"
    catch {rwp [expr {$STRESS_RAM + 0x10}]}
}
if {[catch {wp [expr {$STRESS_RAM + 0x20}] 4 r} e]} {
    s_no "read watchpoint" $e
} else {
    s_ok "read watchpoint set"
    catch {rwp [expr {$STRESS_RAM + 0x20}]}
}

# --- run control ------------------------------------------------------------
s_phase "Run control soak (x$STRESS_ITERS)"

set bad 0
for {set i 0} {$i < $STRESS_ITERS} {incr i} {
    if {[catch {resume}]} { incr bad ; continue }
    if {[catch {halt}]}   { incr bad ; continue }
    if {[arvern.cpu curstate] ne "halted"} { incr bad }
}
s_check "resume/halt x$STRESS_ITERS" [expr {$bad == 0}] "$bad iteration(s) failed"

halt
set bad 0
for {set i 0} {$i < $STRESS_ITERS} {incr i} {
    if {[catch {step}]} { incr bad ; continue }
    if {[arvern.cpu curstate] ne "halted"} { incr bad }
}
s_check "single-step x$STRESS_ITERS" [expr {$bad == 0}] "$bad step(s) failed or left the hart running"

set bad 0
for {set i 0} {$i < 5} {incr i} {
    if {[catch {reset halt}]} { incr bad ; continue }
    if {[s_reg pc] != $STRESS_ROM} { incr bad }
}
s_check "reset halt x5 lands on the reset vector" [expr {$bad == 0}] \
    "$bad reset(s) did not halt at [format 0x%08x $STRESS_ROM]"

# --- soak -------------------------------------------------------------------
# Rare arbitration races need volume, not cleverness. Output is suppressed per
# iteration (a 500-pass soak would bury the one line that matters); only the
# first failure and a periodic heartbeat line are printed.
if {$STRESS_SOAK > 0} {
    s_phase "Soak x$STRESS_SOAK at ${::S_TOPSPEED} kHz (halted + running)"
    set soak_fail0 $::S_FAIL
    set ::S_QUIET 1
    for {set it 1} {$it <= $STRESS_SOAK} {incr it} {
        set ::S_ITER $it
        catch {halt}
        s_mem_pass $STRESS_RAM $STRESS_WORDS
        s_running_pass "soak"
        if {$it == 1 || $it % 10 == 0 || $it == $STRESS_SOAK} {
            echo [format "  iter %d/%d  fails=%d  heartbeat=%d" $it $STRESS_SOAK $::S_FAIL $::S_HB]
        }
    }
    set ::S_QUIET 0
    set ::S_ITER ""
    s_check "soak completed with no failures" [expr {$::S_FAIL == $soak_fail0}] \
        "[expr {$::S_FAIL - $soak_fail0}] failure(s) during the soak"
}

# --- summary ----------------------------------------------------------------
reset halt

echo ""
echo "=============================================================="
echo "  SUMMARY"
echo "=============================================================="
echo [format "  passed : %d" $::S_PASS]
echo [format "  failed : %d" $::S_FAIL]
echo [format "  top TCK: %d kHz (started at %d)" $::S_TOPSPEED [lindex $STRESS_SPEEDS 0]]
if {$::S_FAIL} {
    echo ""
    echo "  FIRST failure: $::S_FIRST"
    echo ""
    echo "  all failures:"
    foreach f $::S_FAILS { echo "    $f" }
}
echo ""
echo "  hart left halted at the reset vector; re-load your ELF before debugging."
echo "=============================================================="

if {$STRESS_SHUTDOWN} { shutdown }
