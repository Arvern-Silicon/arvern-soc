# OpenOCD config: FT232H (MPSSE) -> aRVern JTAG DTM (DTM_TYPE=0, the board default)
# Scan-chain cross-check only: reads IDCODE + validates IR. No RISC-V target
# needed, so any OpenOCD build works. Independent of arvern-tools/pyftdi.
#
# Wiring (FT232H): D0=TCK, D1=TDI, D2=TDO, D3=TMS, common GND. I2C switch OFF.

adapter driver ftdi
ftdi vid_pid 0x0403 0x6014

# ADBUS layout: TCK=bit0, TDI=bit1, TDO=bit2, TMS=bit3.
#   data init 0x0008 -> TMS idles high;  direction 0x000b -> TCK/TDI/TMS out, TDO in
ftdi layout_init 0x0008 0x000b

transport select jtag
adapter speed 100

# aRVern TAP: 5-bit IR, reference IDCODE 0x080001F7 (mismatch only warns).
# Bits [11:1] = Arvern Silicon's JEDEC identity (IEEE 1149.1 §12.2.1, fixed for
# every board); bits [27:12] = 0x8000, this board (DE0-Nano-SoC) in Arvern's own
# FPGA reference-board catalog. See arvern-ips/arv_dtm/doc/arv_dtm.md.
# A mismatch here means the bitstream on the board was built with a different
# IDCODE -- re-synthesize and re-flash.
jtag newtap arvern cpu -irlen 5 -expected-id 0x080001F7

init
scan_chain
shutdown
